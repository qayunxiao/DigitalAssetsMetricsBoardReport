# RealtimeCoreMetricsBoard 运行配置
#
[proxy]
# 上游取数出口（HTTP／HTTPS 同端口）。留空 = 不走代理，FRED/财政部会因 CORS 之外的网络不可达而失败，
# 页面将全部退回内置快照并在卡片上标注「○ 快照」。
http = http://127.0.0.1:3067
https = http://127.0.0.1:3067

[server]
# 本地取数服务端口。监听地址固定为 127.0.0.1，不提供配置项（见 README 第 8 节安全边界）。
port = 4319

[log]
# 相对路径按本项目目录解析；日志每日午夜轮转，保留 14 天。
# level：DEBUG（含缓存命中明细）／INFO（默认）／WARNING（只留失败痕迹）
dir = logs
level = INFO

[page]
# 页面底部「修订记录」（⑧ 数据来源之后）是否展示：1 展示（标题可点击展开／收缩，折叠状态记在浏览器
# localStorage 的 rev-open，删掉该键即回到默认展开）／0 隐藏。
# 由本地服务在返回 HTML 时替换标记，所以只对 http://127.0.0.1:4319/... 生效；
# 直接双击 HTML 打开时看不到这个开关，修订记录按默认展示。隐藏只是不渲染，历史版本仍留在文件里。
show_fix = 1
