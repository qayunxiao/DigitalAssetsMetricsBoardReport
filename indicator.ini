# ==================== 页面指标日报（api/notify.py 的 --html-alert 路径）====================
# 这一整块（本段 + 底下那段 [html_alert_bottom]）与上面 [bottom_alert]/[top_alert] 那套「多指标凑几项」的底部/顶部提示无关：
# 这里监测的是**看板页面那三张卡**，取数走的正是 staic/btc.html 显示的那一份（api/btc.py），
# 所以消息里的数与你在页面上看到的字一模一样，两段都只比大小、不重算任何指标。
# 2026-09-24 拆成两段：本段=「可能顶部」（阈值往高了判），[html_alert_bottom]=「可能底部」（往低了判）。
# 同一天又改了一次口径（**现在生效的是这条**）：两段合成**一条指标日报**——不论触没触发，每天固定发一条，
# 正文一行一张卡：「当前实际值 + 数据日期」一列，两段各自「设置的条件 + ✓/✗」各占一列。
# 于是记账也并成一本（data/notify_html_state.json，旧的 ..._top_state.json / ..._bottom_state.json 停用）：
# 一条消息两列判定，不再有「顶部评过但底部没评过」这种中间态。
# 怎么跑：`python api/notify.py --html-alert` 一次把两段都判完并打表，**不带 --send 一条都不发**；确认无误再 `--html-alert --send`。
#   只想看一段的条件列：`--html-alert-top` / `--html-alert-bottom`（那本账是共用的，跑过一段当天就不再发完整的了）。
# 定时：cron 每分钟拉起一次即可。两道闸门都走在取数前面：任一段还没到自己的 ALERT_AT（两段都写时刻时取较晚那个）、
#   或者今天的日报已经发过，就整条跳过（被挡时连上游都不打，下面两条注释分别解释「不早于」和「一天只发一条」为什么这样设计）。
#   serv00 上挂的是站点根的 alert_cron.sh（它会把**两段**的时刻都设空，「几点跑」整个交给 crontab 那五个字段）：
#   serv00  crontab -e  ->  10,40 8 * * *   /usr/home/myaibtc/domains/myaibtc.serv00.net/alert_cron.sh
#   本机    计划任务指向同一条命令（解释器与路径按本机实际填）
# 本段每个键都能用同名环境变量临时覆盖（前缀 HTML_ALERT_TOP_，见各键下面那行 env=）；优先级：环境变量 > 本段 > 代码里的默认值。
# ⚠ 时刻按**跑脚本那台机器的本地时区**解释，两边时区不同触发的绝对时刻就不同。别猜：`date` 或在页面上看首页「浏览器 − 服务端」那一格，
#   对一下服务器时间再决定这一行写几点。

# 每天监测时刻，格式 hh:mm（24 小时制）。env=HTML_ALERT_TOP_AT
# 语义是「不早于此时刻」，不是「必须正好等于这一分钟」：cron 每分钟一次时，到点后的第一次会真发，
# 当天其后再跑到会被「一天只发一条」挡住。这样万一 08:10 那分钟机器没起来／脚本正被占着，08:11 之后仍会补发，不会整天空过。
# 留空 = 不设时间闸门：脚本一起来就发当天那条，发过之后当天不再发（靠的是下面那条「一天只发一条」，不会变成每分钟一条）。
# 两段各写各的时刻时，取**较晚**的那个：早段还没到点就整条日报都不发，否则并排的两列里会有一列是上一小时的旧数。
ALERT_AT = 13:28

# 需要同时满足的项数（1~3）。env=HTML_ALERT_TOP_HITS
# 3 = 三项全中才算触发（多指标共振，代码默认）；1 = 任一命中即算触发；2 = 任意两项；留空 = 等同 3（有几项算几项全中）。
# 「停用」的项（值为空或写坏、TWM 那项填 0）不算也不占额；但**取不到数的项照样占额**：写着 3 就要三项都成立，
# 有一项这次没数，那段就是「未触发」（日报照发，那一格是 — 并进「缺口」）。
# ⚠ 2026-09-24 用户改口径：这条链现在是**指标日报**，**不论触没触发每天固定发一条**，正文里同时列出
#   「当前实际值」和「本段设置的条件」（顶部、底部各一列）。所以这里的数**只决定正文那句结论写不写「触发」**，
#   不再是发不发的开关 —— 想少收消息改 crontab，别改这里。
ALERT_HITS = 1

# 项① AHR999 定投指数（倍）：页面「AHR999 定投指数」那张卡的头条值。env=HTML_ALERT_TOP_AHR999_MAX
# 条件：当前值 <= 下面的数即该项满足。0.57 落在 0.45~1.2 的定投区里、偏便宜那一侧。留空 = 停用本项。
AHR999_MAX = 0.67

# 项② 恐慌贪婪指数（0~100）：页面「恐慌贪婪指数」那张卡的头条值。env=HTML_ALERT_TOP_FEAR_GREED_MIN
# 条件：今日值 >= 下面的数即该项满足。70 已进「贪婪」档（>=75 是极度贪婪）。留空 = 停用本项。
FEAR_GREED_MIN = 70

# 项③ 2年MA乘数通道：日线收盘价高于支撑线 730MA 即该项满足。env=HTML_ALERT_TOP_TWM_CLOSE_ABOVE_SUPPORT
# 收盘取的是通道放大图那条 Yahoo BTC-USD 日线收盘（bands 最后一根的 px，按「该日或之前最近交易日」对齐），
# **不是**首页那个多所现价中位数；比较用同一根上的 lo（730MA 支撑），所以两边日期必然一致、不会拿今天的现价去比昨天的均线。
# 这一项没有数值阈值（比的是两条价），只写 1=启用 / 0 或留空=停用（留空当停用，与前两项同一套规矩）。收盘或支撑任一取不到 -> 本项按缺数据处理，不算满足。
TWM_CLOSE_ABOVE_SUPPORT = 1

# 发给谁：复用 config.ini 的 [notify] tg_bot（--bot QA 可临时覆盖）。
# ⚠ [notify] daily_limit **不适用本路径**：那是极值播报（--btc）的额度。日报自己那条「一个日历日只发一条」已经封顶，
#   别指望把 daily_limit 调大能让这里多发。
# 状态文件 data/notify_html_state.json（**顶部底部共用这一本**，与极值播报那条 data/notify_state.json 各记各的、
# 互不消耗额度），已在 .gitignore 里。旧的 ..._top_state.json / ..._bottom_state.json 是并成一条日报之前的两本，
# 现在没人读了，留在服务器上无害（想清掉就 rm，最坏结果就是当天多打一次上游）。
# 预览（不带 --send）**从不记账**，所以白天任何时候跑一遍看数都行，不会把 cron 当天那条真日报挡掉；真发失败也不记账，
#   下一分钟的 cron 自己会再试一次。手工补发用 --force（它跳过的就是「今天已经发过」那道闸，清楚自己在做什么再用）。
# 消息正文是一张**等宽表格**：头条每段一行结论（命中几/几、要求几 → 触发/未触发），表头是
#   指标 / 当前值 / 数据日期 / 可能顶部 / 可能底部（后两列 = 本段条件 + ✓/✗），末尾一行缺口，
#   靠 Telegram 的代码块渲染对齐：所以这条链路的 sendMessage 带 parse_mode=Markdown，与 --btc 那条纯文本不是一套。

[html_alert_bottom]
# ==================== 「可能底部」那一段：同三张卡，阈值方向反过来 ====================
# 机制与上面 [html_alert_top] 完全一样（同一次取数、各段独立判定，两段的结论并成**同一条日报**的两列），只差两处方向：
#   ① 恐慌贪婪是**越低越接近底部**，所以本段的键叫 FEAR_GREED_MAX（条件是 <=），不是顶部那段的 _MIN（>=）；
#   ② 通道那项比的是「日线收盘 < 支撑 730MA」，键名也从 TWM_CLOSE_ABOVE_SUPPORT 换成 _BELOW_。
# AHR999 两段同名同方向（都 <=），只是数值不同：顶部段 0.67（定投区偏便宜那侧），本段 0.4（跌进抄底区）。
# 环境变量前缀换成 HTML_ALERT_BOTTOM_，其余键名与语义照上面那段，例：HTML_ALERT_BOTTOM_FEAR_GREED_MAX=15 临时收紧。
# 停用的办法也一样：值留空 = 停用该项；ALERT_AT 留空 = 不设时刻；TWM 那项写 0 = 停用。
# ⚠ 本段那三个数是 2026-09-24 按「历史上大底长什么样」填的**起点**（恐慌 <=25 是「极度恐慌」档、AHR999 <=0.4 是抄底区、
#   收盘跌破 730MA），不是标定过的结论。要认真的底部共振口径请看上面 [bottom_alert] 那套八指标；本段只是页面上那三张卡的轻量版。
# ⚠ 两段对同一个数各说各话是**常态**，不是 bug：2026-09-24 实测——AHR999 0.569 在本段是「✗ <= 0.4」、在顶部那段是
#   「✓ <= 0.67」（顶部那一项方向本来就是「偏便宜」，写 1 项即算触发，所以单独一个 AHR999 就能把「可能顶部」点亮）。
#   并成一条日报之后这种事在同一行的两列里直接摆出来，谁中谁没中一眼看得见；要的是「几项共振才算触发」，
#   改上面那段的 ALERT_HITS 和这里的，两个数各自独立。

# 每天监测时刻，格式 hh:mm（24 小时制）。env=HTML_ALERT_BOTTOM_AT
# 语义与顶部那段一样是「不早于此时刻」；cron 走 alert_cron.sh 时这里被显式设空，几点跑由 crontab 决定。
# 两段留同一时刻最省事（同一分钟一次取数、一条日报两列判定）；写两个不同 hh:mm 时取**较晚**那个，早的那段没到点整条都不发。
ALERT_AT = 13:28

# 需要同时满足的项数（1~3）。env=HTML_ALERT_BOTTOM_HITS
# 口径、停用规则、缺数照样占额那三条，全部同上面那段的 ALERT_HITS：只决定正文那一列结论写「触发」还是「未触发」，
# **不决定发不发**（日报每天固定一条，两段的结论并排在同一行的两列里）。这里写 1 = 任一命中即算触发（与顶部那段一致）。
ALERT_HITS = 1

# 项① AHR999 定投指数（倍）：页面「AHR999 定投指数」那张卡的头条值。env=HTML_ALERT_BOTTOM_AHR999_MAX
# 条件：当前值 <= 下面的数即该项满足。0.4 已经低于 0.45 那条「抄底区间」线。留空 = 停用本项。
AHR999_MAX = 0.4

# 项② 恐慌贪婪指数（0~100）：页面「恐慌贪婪指数」那张卡的头条值。env=HTML_ALERT_BOTTOM_FEAR_GREED_MAX
# 条件：今日值 <= 下面的数即该项满足。25 是「极度恐慌」档的上沿，历史阶段底常落在这里。留空 = 停用本项。
FEAR_GREED_MAX = 20

#项③ 2年MA乘数通道：日线收盘价低于支撑线 730MA 即该项满足。env=HTML_ALERT_BOTTOM_TWM_CLOSE_BELOW_SUPPORT
# 取数与顶部那段是同一根（bands 最后一根同时有收盘与支撑的），只是比较方向反过来。1=启用 / 0 或留空=停用。
TWM_CLOSE_BELOW_SUPPORT = 0
