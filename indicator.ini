# 指标：CBBI 牛熊指数(0~100)。高值偏牛、常伴顶部区域情绪。

# 条件：CBBI >= 任一档位即满足。75 与 80,85 兼顾 2022+ 周期顶常见区间。

CBBI_MIN = 75, 80, 85

# 指标：AHR999 定投指数。2–3.5 为过热区、>3.5 为极顶区；2022+ 牛顶常见 2–2.5。

# 条件：AHR999 >= 任一档位即视为危险区。2, 2.5, 3 覆盖过热与极顶。

AHR999_DANGER_MIN = 2, 2.5, 3

# 价格「接近」顶部的容差(%)：当前价在参考顶部区间下方 TOLERANCE_PCT 以内仍视为接近顶部。

TOLERANCE_PCT = 10

# 参考顶部区间：价格 >= ATH×TOP_ZONE_LOW 视为进入顶部区间（0.80 即距 ATH 回撤 20% 以内）；或价格 >= 200WMA×WMA_TOP_MULT 视为高位。

TOP_ZONE_LOW = 0.80

WMA_TOP_MULT = 2.0

