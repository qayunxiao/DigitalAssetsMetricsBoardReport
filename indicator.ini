# 条件：跌幅 <= 任一档位即该项满足。20,25,30 对应距 ATH 回撤不超过 20%/25%/30%。

DROP_PCT_MAX = 20, 25, 30

# 指标：恐慌贪婪指数(0~100)。高值表示极度贪婪，阶段顶常见 75–90。

# 条件：今日值 >= 任一档位即满足。75 增加敏感度，避免 2022+ 周期顶未达 80 时漏报。

