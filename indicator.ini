# ---------- 参考历史数据的定投+抄底底部区域（详见 README）----------

# 历史熊市底部：自ATH跌幅多 70%～80%（2018/2020.3/2022）；200WMA 常为支撑。

# 参考区间：ATH*0.20～0.35（80%～65% 跌幅）；AHR999<0.45 抄底，0.45～1.2 定投；恐慌<25、CBBI<20 常伴阶段底。

# 链上/估值辅助：MVRV<1 低估、NUPL<0 或 <-0.25 历史大底、SOPR<1 亏损卖出、Puell Multiple<0.4 矿工压力底；见下方各指标注释。

# 当前 BOTTOM_LOW/HIGH_MULT=0.32/0.35 对应约 68%/65% 跌幅，略保守，适合定投+抄底；要更贴极值可试 0.25～0.28。

# ----------

# BTC 相对底部提示（runningData_alert）：阈值可多组、逗号分隔；满足「当前值符合条件」的项数 >= BOTTOM_ALERT_NUM 即触发提醒。

[bottom_alert]

# 触发条件：至少满足的条件项数（1~8）。共 8 项：价格接近区间、跌幅、恐慌、CBBI、AHR999抄底、成交量比、MVRV、NUPL。

# 推荐范围：2=敏感(提醒多)、3~4=均衡(多指标共振)、5~6=保守(提醒少置信高)；7~8 极严，历史上大底也难同时满足，几乎不会触发。

BOTTOM_ALERT_NUM = 2

# 指标：自ATH跌幅(%)。自历史最高价以来的回撤百分比；跌幅越大越可能进入底部区。历史熊底多在 65%～80%。

# 条件：当前跌幅 >= 任一档位即该项满足。例：60,65,70 表示跌 60% 或 65% 或 70% 都算。

DROP_PCT_TRIGGER = 60,65,70

# 指标：恐慌贪婪指数(0~100)。Alternative.me 综合波动/情绪/调查等；越低越恐慌，极端恐慌常伴随阶段底。

# 条件：今日值 <= 任一档位即满足。例：10,15,20 表示 10 以下、15 以下或 20 以下都算。

FEAR_GREED_MAX = 10,15,20

# 指标：CBBI（Colin Talks Crypto 牛熊指数，0~100）。综合多维度判断牛熊阶段；低值偏熊、常伴底部。

# 条件：CBBI <= 任一档位即满足。例：20,25 表示 20 或 25 以下视为可能底部情绪。

CBBI_MAX = 20,25

# 指标：AHR999 定投指数。价格相对 200 日定投成本与指数增长的比值；<0.45 常被视为抄底区间，0.45～1.2 定投区。

# 条件：当前 AHR999 < 该上限即视为进入抄底区间（该项满足）。

AHR999_BUY_ZONE_MAX = 0.4

# 指标：成交量比 = 近30日成交均量 / 近365日成交均量。缩量常伴随磨底，比值低表示交投冷清、可能接近底部。

# 条件：比值 < 任一档位即满足。例：0.5,0.6 表示 0.5 或 0.6 以下即算。

VOLUME_RATIO_MAX = 0.7,0.8

# ---------- 链上/估值类底部指标（需报表提供对应字段并接入判断逻辑后生效）----------

# 指标：MVRV = 市值/实现价值(Realized Cap)。当前价相对「全市场持仓成本」的倍数；<1 表示市价低于平均成本，历史多对应低估/底部区。

# 条件：MVRV <= 任一档位即满足。常用：1.0（低估）、0.95 更保守。数据源：looknode/Glassnode。

MVRV_MAX = 0.95,1.0

# 指标：NUPL = 净未实现盈亏。链上整体持仓的浮盈浮亏状态，范围约 -1～1；<0 整体浮亏，<-0.25 历史多次对应大底（如 2015/2018/2020.3/2022）。

# 条件：NUPL <= 任一档位即满足。数据源：CoinGlass/CryptoQuant。

NUPL_MAX = 0,0.14

# 指标：盈利供应占比(%)。当前价格高于成本的 BTC 占比；<50% 历史大底（2015/2018/2020.3/2022），55%～65% 熊市中期。数据源：Look Into Bitcoin。

# 条件：当前值 <= 任一档位即满足。

SUPPLY_IN_PROFIT_MAX = 50,55

# 指标：CVDD 累计价值币天销毁。历史上对周期底部有较好指示；价格接近或低于 CVDD 支撑常为底部。数据源：handle_cvdd(BM Pro/Looknode)。

# 条件：当前价 <= CVDD × CVDD_PRICE_MULT 即满足。例：1.05 表示价在 CVDD 的 105% 以内视为接近支撑。

CVDD_PRICE_MULT = 1.05

# 指标：SOPR = 花费产出利润率。当日花费的 UTXO 若 SOPR<1 表示亏损卖出，持续 <1 常伴随阶段底。数据源：Glassnode/自算。

# 条件：SOPR <= 任一档位即满足。接入报表后取消下一行注释即可。

# SOPR_MAX = 0.98,1.0

# 指标：Puell Multiple = 当日矿工产出价值(USD) / 该值 365 日均。矿工收入远低于年均时压力大、抛压减弱，历史多次对应底部。

# 条件：Puell Multiple <= 任一档位即满足。常用 <0.4。数据源：CryptoQuant/Look Into Bitcoin；接入后取消下一行注释。

# PUELL_MULTIPLE_MAX = 0.4,0.5

# ----------

# 价格「接近」底部的容差(%)：当前价若在「参考底部上界 × (1 + TOLERANCE_PCT/100)」以内，仍视为接近底部区间。

TOLERANCE_PCT = 10

# 参考底部区间（ATH 倍数）：下界 = ATH × BOTTOM_LOW_MULT，上界 = min(200WMA×WMA_MULT, ATH×BOTTOM_HIGH_MULT)。

# 例：ATH=126199、BOTTOM_LOW_MULT=0.32 → 下界 ≈ 40384 USD；BOTTOM_HIGH_MULT=0.35 → 上界约 44170 USD。

BOTTOM_LOW_MULT = 0.46

BOTTOM_HIGH_MULT = 0.38

# 200WMA 倍数：按均线算的参考底部上界 = 200WMA × WMA_MULT。200WMA 历史上常为熊市支撑位。

WMA_MULT = 1.02



# BTC 相对顶部提示（runningData_alert）：满足「当前值符合条件」的项数达到要求即触发接近顶部提醒。

# 以下阈值按 2022 年起数据校准：2022 熊底后 2024–2025 牛顶 ATH≈126k，顶部时恐慌多 75–90、AHR999 多处于 2–3.5 过热区。

[top_alert]

