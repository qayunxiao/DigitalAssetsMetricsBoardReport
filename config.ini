# 数字资产指标看板（DigitalAssetsMetricsBoard）运行配置 —— 合并版单一服务（main.py）
#
# 语义：这里的值只是「默认值」。同名环境变量优先，方便临时改一次而不必动文件：
#   set HTTPS_PROXY=http://127.0.0.1:7890 && python main.py
# 对应关系：[proxy] http/https → HTTP_PROXY/HTTPS_PROXY，[server] port → PORT，
#           [log] dir/level → LOG_DIR/LOG_LEVEL，[page] show_fix → SHOW_FIX。
# 本文件不含任何凭据，可入库；代理端口是本机出口，换网络时改这里。

[proxy]
# 上游取数出口（HTTP／HTTPS 同端口）。留空 = 不走代理，FRED/财政部会因 CORS 之外的网络不可达而失败，
# 页面将全部退回内置快照并在卡片上标注「○ 快照」。
# ⚠ 本段**只在 Windows 生效**（api/core.py 的 apply_config 在非 nt 系统直接跳过 [proxy]）：这两行是本机
# 代理客户端的端口，同一份文件传到 FreeBSD/Linux 服务器上并不存在那个出口，照抄只会让取数全败。
# 服务器确实需要代理时用环境变量：HTTPS_PROXY=http://127.0.0.1:7890 python main.py
http = http://127.0.0.1:3067
https = http://127.0.0.1:3067

[server]
# 本地取数服务端口：页面与 /api/* 同源，共用这一个端口（改端口只改这一行）。监听地址固定为
# 127.0.0.1，不提供配置项（见 README 第 8 节安全边界）。
# 外部访问端口 15888 由你自己的反向代理／端口映射转发到这里（15888 → 127.0.0.1:8888），
# 本服务不监听 15888、也不为此放开绑定；那层一旦对公网开放，等于公开一个无鉴权看板，自己权衡。
port = 8888
# public = 1 → 公网模式（同名环境变量 PUBLIC）：① 静态文件只放 .html/.css/.js/.svg/.ico
# （config.ini、api/*.py、logs/、data/ 顺着 URL 拿不到）；② 持仓报告按 [report] 段的次数上限走，
# 与本机版一样不设访问凭据。
# 本地版留空；部署到服务器时由 passenger_wsgi.py
# 在导入核心层之前写死 PUBLIC=1，所以服务器上这份文件不用改。
public =

[log]
# 相对路径按本项目目录解析；日志每日午夜轮转，保留 14 天。
# level：DEBUG（含缓存命中明细）／INFO（默认）／WARNING（只留失败痕迹）
dir = logs
level = INFO

[page]
# 页面底部「修订记录」（⑧ 数据来源之后）是否展示：1 展示（标题可点击展开／收缩，折叠状态记在浏览器
# localStorage 的 rev-open，删掉该键即回到默认展开）／0 隐藏。
# 由本地服务在返回 HTML 时替换标记，所以只对 http://127.0.0.1:8888/... 生效；
# 直接双击 HTML 打开时看不到这个开关，修订记录按默认展示。隐藏只是不渲染，历史版本仍留在文件里。
show_fix = 1

[report]
# 首页两个报告按钮 = 让服务执行 cryptoTrader 对应的报表脚本，stdout 原样回页面显示；两个 kind 走同一套流程：
#   加密持仓报告 -> tests/runningOrder.py     （统计币价持仓，逐单拉价，慢）
#   US股持仓报告 -> tests/runningStorcksOrder.py（按人员分组统计 data/us_stocks 的美股 CSV，读单即可，快）
# 脚本路径留空 = 按操作系统用内置默认（api/allocation.py 的 REPORT 表）：
# Windows: python + D:/Qorder_ws/cryptoTrader/tests/<脚本名>；
# Linux/FreeBSD: /home/myaibtc/vevns/web3/bin/python + /home/myaibtc/vevns/cryptoTrader/tests/<脚本名>。
# 只有当那个脚本所需的依赖不在系统 python 里时（例如缺 openpyxl 就读不了 xlsx），才需要指定它自己的解释器。
# 注意副作用：两个脚本都是无参数运行即向 Telegram 推送报表（--DD 才是只发钉钉），点一次发一条。
# 子进程原样继承本服务的环境（含 HTTPS_PROXY），但脚本自己的代理开关在 cryptoTrader/config/config.ini
# 的 [proxy] 段（ENABLED/HOST/PORT_HTTP/PORT_HTTPS，且只在 Windows 生效），这里配了也不覆盖它。
# ⚠ 下面这行 python 和 [proxy] 同性质：**只在 Windows 被读取**（api/core.py 的 apply_config 在非 nt 系统跳过它），
# 因为它是这台机器的绝对路径。服务器上换解释器用环境变量 REPORT_PY=/绝对路径/python。
# 这行是 cryptoTrader 自己的 venv（含 openpyxl/pandas/requests）；两个脚本共用它。
python = E:\UserTools\py311_envs\WEB3\Scripts\python.exe
crypto_script =
us_script =
# 每天最多点几次：加密 3 次、美股 2 次，两个 kind 各自计数（互不占用）。
# 计数写在 data/report_quota.json，按本地日期自动隔天清零、且服务重启不清零——重启服务不该白送额度。
# 点满之后对应按钮置灰、接口回 429。
daily_limit = 3
us_daily_limit = 2
# 公网版（PUBLIC=1，serv00）与本机版同一口径：按钮点了就跑，不设任何访问凭据（2026-09-22 用户定，
# 因为报表正文是发到他自己 Telegram 的那份，页面只是把 stdout 再显示一次）。唯一约束就是上面的
# daily_limit / us_daily_limit 与「同一时刻只跑一个报表进程」。所以任何密钥/令牌都不要出现在这里。
